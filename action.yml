name: "Terramind GitHub Action"
description: "Run Terramind in GitHub Actions workflows"
branding:
  icon: "code"
  color: "orange"

inputs:
  model:
    description: "Model to use (optional, defaults to gpt-5.4)"
    required: false
    default: "gpt-5.4"

  share:
    description: "Share the Terramind session (defaults to true for public repos)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Install Terramind
      shell: bash
      run: curl -fsSL https://terramind.com/install | bash

    - name: Run Terramind
      shell: bash
      id: run_terramind
      run: terramind github run
      env:
        MODEL: ${{ inputs.model }}
        SHARE: ${{ inputs.share }}

